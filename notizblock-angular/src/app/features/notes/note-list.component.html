<mat-card class="note-list-container">
  <mat-card-header>
    <mat-card-title>Notizblock Verwaltung</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="notes-count">Anzahl Notizen: <strong>{{ notesCount() }}</strong></span>
      </div>
      <div class="toolbar-right">
        <button mat-raised-button color="primary" (click)="openCreateDialog()">
          <mat-icon>add</mat-icon>
          Neue Notiz
        </button>
      </div>
    </div>

    <!-- Material Table -->
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort class="notes-table">

        <!-- Title Column -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Titel</th>
          <td mat-cell *matCellDef="let note">
            <strong>{{ note.title }}</strong>
          </td>
        </ng-container>

        <!-- Content Column -->
        <ng-container matColumnDef="content">
          <th mat-header-cell *matHeaderCellDef>Inhalt</th>
          <td mat-cell *matCellDef="let note" class="content-cell">
            {{ getTruncatedContent(note.content) }}
          </td>
        </ng-container>

        <!-- Created At Column -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Erstellt am</th>
          <td mat-cell *matCellDef="let note">
            {{ formatDate(note.createdAt) }}
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Aktionen</th>
          <td mat-cell *matCellDef="let note" class="actions-cell">
            <button mat-icon-button color="primary"
                    (click)="viewDetail(note)"
                    matTooltip="Details anzeigen">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button color="accent"
                    (click)="openEditDialog(note)"
                    matTooltip="Bearbeiten">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn"
                    (click)="openDeleteDialog(note)"
                    matTooltip="Löschen">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- No Data Row -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">
            Keine Notizen vorhanden
          </td>
        </tr>
      </table>

      <!-- Paginator -->
      <mat-paginator
        [pageSizeOptions]="[5, 10, 20]"
        [pageSize]="10"
        showFirstLastButtons>
      </mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
